plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
version = '1.3.0-r19'
group = 'dev.barryalen'
// 下载文件名固定为 Touhoulittlemaid-Sophisticated-1.21.1.jar（不拼版本号）；
// 模组内的版本号仍走 version → mods.toml，进游戏在模组列表里看。
base { archivesName = 'Touhoulittlemaid-Sophisticated-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }

neoForge {
    // NeoForge 本体（含官方映射），版本必须和目标 MC 一致
    version = '21.1.244'
    mods {
        maid_sophisticated {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // 编译期依赖：精妙背包、精妙核心与车万女仆（只做类型检查，不会打进成品 jar）
    compileOnly fileTree(dir: 'libs', include: ['sophisticatedcore*.jar', 'sophisticatedbackpacks*.jar', 'touhoulittlemaid-*.jar'])
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar {
    // 成品文件名不带版本号：Touhoulittlemaid-Sophisticated-1.21.1.jar
    archiveVersion = ''
}
processResources {
    def props = [mod_id: 'maid_sophisticated', mod_name: 'Touhou Little Maid: Sophisticated', mod_version: project.version,
                 display_name: '车万女仆：这很精妙', mod_authors: 'BarryAlen777', mod_license: 'MIT',
                 minecraft_version: '1.21.1', neoforge_version: '21.1.244']
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
    // mods.toml 写的是 MIT，jar 里就得带上许可证原文（整合包/启动器会检查）
    from('LICENSE') { into 'META-INF' }
}
// NeoForge 用 neoforge.mods.toml 的 [[mixins]] 声明补丁，不再需要 jar 清单里的 MixinConfigs
